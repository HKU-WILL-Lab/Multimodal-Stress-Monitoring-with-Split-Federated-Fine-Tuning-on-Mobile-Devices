<!DOCTYPE html>
<html class="light" lang="en" style=""><head><link rel="stylesheet" href="training.css"><link rel="stylesheet" href="vendor/inter.css"><link rel="stylesheet" href="vendor/symbols.css"><style>
.settings-main{max-width:512px;margin:auto;padding:24px 24px 128px;display:flex;flex-direction:column;gap:24px}
.settings-main h2{font-size:24px;line-height:30px;font-weight:600}.settings-main h3{font-size:20px;font-weight:600}
.settings-card{padding:24px;border-radius:12px;background:#ffffffcc;border:1px solid #ffffff33;box-shadow:0 8px 32px #0000000a;display:flex;flex-direction:column;gap:16px}
.setting-field{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#464555}
.setting-field input{width:100%;min-width:0;border:1px solid #c7c4d8;border-radius:8px;padding:12px;background:#f8f9ff;color:#0b1c30;font:inherit}
.settings-main button{border:0;border-radius:24px;padding:12px 16px;background:#3525cd;color:white;font:600 14px Inter;cursor:pointer}
.settings-main button.secondary{background:#e5eeff;color:#3525cd}.settings-main button:disabled{opacity:.4;cursor:default}
.settings-main p{font-size:14px;line-height:22px;color:#464555;overflow-wrap:anywhere}.settings-main a{color:#3525cd;font-size:14px}
.settings-actions{display:flex;gap:8px;flex-wrap:wrap}#runtime-error{color:#93000a;background:#ffdad6;padding:16px;border-radius:12px}
</style></head><body class="antialiased font-body-md selection:bg-primary selection:text-on-primary"><svg class="inline-defs-container" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Mobile App Training - SFL Progress</title>




<!-- Tailwind Configuration -->





<!-- Top App Bar Shell (from JSON) -->
<header class="sticky top-0 z-50 flex justify-between items-center px-container-margin w-full h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-variation-settings: 'FILL' 0;">psychology</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Cognitive Sanctuary</h1>
</div>
<button aria-label="Profile" class="flex items-center justify-center p-2 rounded-full hover:bg-primary/5 transition-colors text-on-surface-variant" data-page="settings">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Main Content Area -->
<main class="settings-main">
<h2>Settings</h2>
<section class="settings-card"><h3>Local inference model</h3><label class="setting-field">Deployment config<input name="inferenceConfig" type="text" spellcheck="false" autocomplete="off"></label>
<button data-action="load">Load local model</button><p id="inference-message"></p></section>
<section class="settings-card"><h3>SFL Training</h3><label class="setting-field">Client ID<input name="clientId" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Main server (host:port)<input name="mainServer" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Federated server (host:port)<input name="federatedServer" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Training config<input name="configPath" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Model directory<input name="modelDirectory" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Encoder program<input name="encoderProgram" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Sensor dataset<input name="datasetPath" type="text" spellcheck="false" autocomplete="off"></label><label class="setting-field">Encoder input length<input name="encoderInputLength" type="number" min="1" spellcheck="false" autocomplete="off"></label><label class="setting-field">Aggregation status URL<input name="aggregationEndpoint" type="text" spellcheck="false" autocomplete="off"></label>
<div class="settings-actions"><button data-action="start">Start training</button><button data-action="cancel" class="secondary">Stop training</button></div>
<p id="settings-training-message"></p><a href="training.html">View training progress →</a></section>
<section class="settings-card"><h3>Interface preview</h3><p>Demo predictions only. Sensor charts wait for actual watch data.</p>
<button data-action="preview">Preview interface with demo data</button><button data-action="clearPreview" class="secondary">Clear demo preview</button><p id="runtime-source"></p></section>
<button data-action="save">Save settings</button><p id="settings-notice" role="status"></p>
<p id="runtime-error" role="alert" hidden></p></main>
<!-- Bottom Nav Bar Shell (from JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe h-20 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-2xl bg-surface-container-low/40 dark:bg-surface-container-highest/10 border-t border-white/20 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] md:hidden">
<!-- Vitals (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:scale-105 transition-transform" href="vitals.html" data-page="vitals">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">monitoring</span>
<span class="font-label-sm text-label-sm">Vitals</span>
</a>
<!-- Training (Active) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:scale-105 transition-transform" href="training.html" data-page="training">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">hub</span>
<span class="font-label-sm text-label-sm">Training</span>
</a>
<!-- Insights (Inactive) -->

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
